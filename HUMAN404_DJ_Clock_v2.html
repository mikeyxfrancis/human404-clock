<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#05080c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>HUMAN404 DJ Clock</title><style>:root{color-scheme:dark;--cyan:#00d9f7}*{box-sizing:border-box}body{margin:0;background:#05080c;color:#d5faff;font-family:system-ui,-apple-system,sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center}main{width:min(100%,1050px);padding:16px 24px 22px}.top{display:flex;justify-content:space-between;align-items:center;color:#67939c;font-size:11px;letter-spacing:.22em;margin-bottom:12px}.group{background:linear-gradient(160deg,#0b1118,#040609);border:1px solid #15232a;border-radius:18px;padding:12px 18px 16px;margin-bottom:12px;text-align:center}.label{font-size:11px;letter-spacing:.24em;color:#6a929c;margin-bottom:4px}.digits{display:flex;justify-content:center;align-items:center;gap:clamp(2px,.9vw,12px);height:clamp(75px,20vh,165px)}.digit{position:relative;width:clamp(36px,9.5vw,95px);height:clamp(69px,19vh,155px);filter:drop-shadow(0 0 7px #00c8ed66)}.seg{position:absolute;background:#12232a;opacity:.4;clip-path:polygon(15% 0,85% 0,100% 50%,85% 100%,15% 100%,0 50%)}.seg.on{background:#00d9f7;opacity:1;box-shadow:0 0 18px #00d9f7}.a,.g,.d{height:9%;width:76%;left:12%}.a{top:1%}.g{top:45.5%}.d{bottom:1%}.f,.b,.e,.c{width:11%;height:42%;clip-path:polygon(50% 0,100% 12%,100% 88%,50% 100%,0 88%,0 12%)}.f{left:1%;top:5%}.b{right:1%;top:5%}.e{left:1%;bottom:5%}.c{right:1%;bottom:5%}.colon{height:100%;display:flex;flex-direction:column;justify-content:space-around;padding:20px 0;width:clamp(9px,2vw,20px)}.colon i{display:block;background:var(--cyan);height:9px;width:9px;border-radius:2px;box-shadow:0 0 12px var(--cyan)}.controls{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}button,select{background:#101f27;border:1px solid #23515e;color:#aaf3ff;border-radius:10px;padding:10px 15px;font:600 13px system-ui;cursor:pointer}button.primary{background:#007f97;color:white}button:active{transform:scale(.98)}.status{text-align:center;color:#719ca5;font-size:11px;margin:8px 0 12px}.warn{color:#ff9e78}body.full main{width:100%;max-width:none}body.full .group{padding:8px 12px}body.full .digits{height:clamp(80px,25vh,220px)}body.full .digit{height:clamp(74px,23vh,205px);width:clamp(40px,10.5vw,115px)}@media(orientation:portrait){main{padding:15px}.digits{height:110px}.digit{width:10vw;height:100px}.group{padding:15px 5px}}@media(max-height:440px){main{padding:7px 20px}.top{margin-bottom:3px}.group{margin-bottom:5px;padding:4px 10px}.digits{height:clamp(60px,23vh,110px)}.digit{height:clamp(58px,22vh,100px);width:clamp(32px,8vw,65px)}.label{font-size:9px;margin:0}.controls button,.controls select{padding:7px 10px}.status{margin:3px 0 5px}}.displays{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,4vw,58px);align-items:stretch}.displays .group{min-width:0}.displays .digits{height:clamp(75px,18vh,155px);gap:clamp(1px,.3vw,5px)}.displays .digit{width:clamp(20px,4.6vw,58px);height:clamp(56px,15vh,125px)}.displays .colon{width:clamp(6px,1vw,13px);padding:14px 0}.displays .colon i{width:clamp(4px,.6vw,8px);height:clamp(4px,.6vw,8px)}body.full .displays .digit{width:clamp(20px,4.6vw,58px);height:clamp(56px,15vh,125px)}@media(orientation:portrait){.displays{grid-template-columns:1fr;gap:12px}.displays .digit{width:9vw;height:100px}}@media(max-height:440px) and (orientation:landscape){.displays .digits{height:clamp(65px,30vh,115px)}.displays .digit,body.full .displays .digit{height:clamp(58px,27vh,105px);width:clamp(18px,4.2vw,48px)}.displays{gap:clamp(16px,3vw,40px)}}</style></head><body><main><div class="top"><span>HUMAN404 / LIVE</span><span id="zone">LOCAL TIME</span></div><div class="displays"><section class="group"><div class="label">SET TIME REMAINING</div><div class="digits" id="timer" aria-label="Countdown"></div></section><section class="group"><div class="label">LOCAL TIME</div><div class="digits" id="clock" aria-label="Current local time"></div></section></div><div class="controls"><select id="duration" aria-label="Set duration"><option value="30">30 MIN</option><option value="45">45 MIN</option><option value="60">60 MIN</option><option value="90">90 MIN</option><option value="120" selected>120 MIN</option><option value="180">180 MIN</option><option value="240">240 MIN</option></select><button class="primary" id="start">START</button><button id="reset">RESET</button><button id="full">FULL SCREEN</button><button id="wake">KEEP AWAKE</button></div><div class="status" id="status">Ready • Use landscape for best view</div></main><script>const map={0:'abcdef',1:'bc',2:'abged',3:'abgcd',4:'fgbc',5:'afgcd',6:'afgecd',7:'abc',8:'abcdefg',9:'abcdfg'};function digit(n){let d=document.createElement('div');d.className='digit';for(let s of 'abcdefg'){let e=document.createElement('span');e.className='seg '+s+(map[n]?.includes(s)?' on':'');d.appendChild(e)}return d}function draw(id,str){let el=document.getElementById(id);if(el.dataset.value===str)return;el.dataset.value=str;el.replaceChildren(...[...str].map(c=>{if(c===':'){let e=document.createElement('div');e.className='colon';e.innerHTML='<i></i><i></i>';return e}return digit(c)}))}let seconds=7200,deadline=null,running=false,lock=null;const dur=document.getElementById('duration'),start=document.getElementById('start'),status=document.getElementById('status');function format(s){s=Math.max(0,Math.ceil(s));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}function tick(){let now=new Date();draw('clock',[now.getHours(),now.getMinutes(),now.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':'));if(running){seconds=Math.max(0,(deadline-Date.now())/1000);if(seconds<=0){running=false;start.textContent='START';status.textContent='SET COMPLETE'}}draw('timer',format(seconds));}dur.addEventListener('change',()=>{running=false;seconds=Number(dur.value)*60;start.textContent='START';status.textContent='Ready';tick()});start.addEventListener('click',()=>{if(running){seconds=Math.max(0,(deadline-Date.now())/1000);running=false;start.textContent='RESUME';status.textContent='Paused'}else{if(seconds<=0)seconds=Number(dur.value)*60;deadline=Date.now()+seconds*1000;running=true;start.textContent='PAUSE';status.textContent='Countdown running'}tick()});document.getElementById('reset').addEventListener('click',()=>{running=false;seconds=Number(dur.value)*60;start.textContent='START';status.textContent='Reset';tick()});document.getElementById('full').addEventListener('click',async()=>{document.body.classList.toggle('full');try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(document.fullscreenElement)await document.exitFullscreen()}catch(e){status.textContent='For full-screen feel, Add to Home Screen in Safari'}});document.getElementById('wake').addEventListener('click',async()=>{try{if(!('wakeLock'in navigator))throw Error('unsupported');lock=await navigator.wakeLock.request('screen');status.textContent='Screen wake lock active';lock.addEventListener('release',()=>{status.textContent='Wake lock released — check Auto-Lock setting'})}catch(e){status.textContent='Set iPhone Settings → Display & Brightness → Auto-Lock → Never'}});document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&lock&&!lock.released){try{lock=await navigator.wakeLock.request('screen')}catch(e){}}tick()});try{document.getElementById('zone').textContent=Intl.DateTimeFormat().resolvedOptions().timeZone.replaceAll('_',' ').toUpperCase()}catch(e){}tick();setInterval(tick,200);</script></body></html>
